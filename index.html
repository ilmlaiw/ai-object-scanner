<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Object Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: none;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #video, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay {
      pointer-events: none;
    }
    #ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 16px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.35));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #status {
      font-size: 14px;
      opacity: 0.9;
      text-align: center;
    }
    #toggle-btn {
      appearance: none;
      border: none;
      border-radius: 9999px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      background: #22c55e;
      color: #000;
      width: 100%;
      touch-action: manipulation;
    }
    #toggle-btn:disabled {
      background: #374151;
      color: #9ca3af;
    }
    #error-banner {
      display: none;
      background: #ef4444;
      color: #000;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="camera-container">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="ui-layer">
      <div id="error-banner"></div>
      <div id="status">Initializing…</div>
      <button id="toggle-btn" disabled>Start Scanning</button>
    </div>
  </div>

  <script>
    (function () {
      const video = document.getElementById('video');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const statusEl = document.getElementById('status');
      const toggleBtn = document.getElementById('toggle-btn');
      const errorBanner = document.getElementById('error-banner');

      let model = null;
      let stream = null;
      let detecting = false;
      let animationId = null;

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        statusEl.textContent = 'Camera unavailable';
        toggleBtn.disabled = true;
      }

      function resizeCanvasToVideo() {
        const rect = video.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
      }

      function drawBoxes(predictions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!predictions || predictions.length === 0) return;

        const videoRect = video.getBoundingClientRect();
        const scaleX = canvas.width / videoRect.width;
        const scaleY = canvas.height / videoRect.height;

        ctx.lineWidth = 3;
        ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        ctx.textBaseline = 'top';

        predictions.forEach(p => {
          const [x, y, w, h] = p.bbox;
          const sx = x * scaleX;
          const sy = y * scaleY;
          const sw = w * scaleX;
          const sh = h * scaleY;

          const label = `${p.class} ${(p.score * 100).toFixed(0)}%`;
          const textMetrics = ctx.measureText(label);
          const textWidth = textMetrics.width;
          const textHeight = 18;
          const padding = 6;

          ctx.strokeStyle = '#22c55e';
          ctx.strokeRect(sx, sy, sw, sh);

          ctx.fillStyle = 'rgba(0,0,0,0.75)';
          ctx.fillRect(
            sx,
            sy - textHeight - padding,
            textWidth + padding * 2,
            textHeight + padding
          );

          ctx.fillStyle = '#fff';
          ctx.fillText(label, sx + padding, sy - textHeight - padding + 2);
        });
      }

      async function detectFrame() {
        if (!detecting || !model) return;
        try {
          const predictions = await model.detect(video);
          drawBoxes(predictions);
        } catch (e) {
          // Silently ignore occasional frame errors to keep loop stable
        }
        animationId = requestAnimationFrame(detectFrame);
      }

      async function startCamera() {
        statusEl.textContent = 'Requesting camera…';
        try {
          const constraints = {
            video: {
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          await video.play();
          resizeCanvasToVideo();
          window.addEventListener('resize', resizeCanvasToVideo);
          statusEl.textContent = 'Camera active';
          toggleBtn.disabled = false;
          toggleBtn.textContent = 'Start Scanning';
        } catch (e) {
          console.error(e);
          showError('Camera permission denied or not available. Ensure you’re on HTTPS and allow camera access.');
        }
      }

      async function loadModel() {
        statusEl.textContent = 'Loading AI model…';
        try {
          await tf.ready();
          model = await cocoSsd.load();
          statusEl.textContent = 'AI ready';
        } catch (e) {
          console.error(e);
          showError('Failed to load AI model. Check your connection and try again.');
        }
      }

      toggleBtn.addEventListener('click', async () => {
        if (!model) {
          statusEl.textContent = 'AI not ready yet…';
          return;
        }
        if (!stream) {
          await startCamera();
          if (!stream) return;
        }
        detecting = !detecting;
        if (detecting) {
          toggleBtn.textContent = 'Stop Scanning';
          toggleBtn.style.background = '#ef4444';
          toggleBtn.style.color = '#fff';
          statusEl.textContent = 'Scanning active';
          detectFrame();
        } else {
          toggleBtn.textContent = 'Start Scanning';
          toggleBtn.style.background = '#22c55e';
          toggleBtn.style.color = '#000';
          statusEl.textContent = 'Scanning paused';
          if (animationId) cancelAnimationFrame(animationId);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      });

      // Initialize
      (async function init() {
        await loadModel();
        await startCamera();
      })();
    })();
  </script>
</body>
</html>
