<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Object Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07151c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Object Scanner" />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22AI%20Object%20Scanner%22%2C%22short_name%22%3A%22Scanner%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2307151c%22%2C%22theme_color%22%3A%22%2307151c%22%2C%22start_url%22%3A%22.%22%7D" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <style>
    :root { --cyan: #54f5e4; --ink: #07151c; --orange: #ffb45c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: #effffc; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    #app { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; background: radial-gradient(circle at 50% 10%, #16343b 0, var(--ink) 48%, #03090c 100%); }
    #camera-container { position: relative; min-height: 0; overflow: hidden; background: #020607; }
    #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #video { filter: saturate(.82) contrast(1.05); }
    #overlay { pointer-events: none; }
    #camera-container::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(84,245,228,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(84,245,228,.035) 1px, transparent 1px); background-size: 32px 32px; mix-blend-mode: screen; }
    #ui-layer { position: relative; z-index: 10; padding: 14px 16px max(18px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(84,245,228,.32); background: rgba(4,18,23,.92); box-shadow: 0 -12px 36px rgba(0,0,0,.3); }
    #toggle-btn { min-height: 52px; border: 1px solid var(--cyan); border-radius: 4px; background: var(--cyan); color: #061217; letter-spacing: .08em; text-transform: uppercase; touch-action: manipulation; transition: background .2s, color .2s; }
    #toggle-btn:disabled { border-color: #426067; background: #263b40; color: #839da1; }
    #error-banner { display: none; margin-bottom: 10px; border-left: 3px solid #ff7373; padding: 8px 10px; background: rgba(95,25,30,.8); color: #ffd5d5; font-size: 12px; }
    #status { text-shadow: 0 0 12px rgba(84,245,228,.8); transition: color .2s, text-shadow .2s; }
    #status.status-error { color: #ff9a9a; text-shadow: 0 0 12px rgba(255,92,92,.75); }
    #hud-shell { position: absolute; inset: 0; pointer-events: none; }
    #log-panel { pointer-events: auto; position: absolute; top: 16px; right: 16px; width: min(240px, calc(100% - 32px)); max-height: 38vh; overflow: hidden; border: 1px solid rgba(84,245,228,.3); border-radius: 5px; background: rgba(4,18,23,.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 12px 30px rgba(0,0,0,.25); }
    #log-list { max-height: calc(38vh - 44px); overflow: auto; scrollbar-width: thin; }
    .log-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid rgba(84,245,228,.12); padding: 7px 10px; font-size: 11px; }
    .log-row strong { color: #effffc; font-weight: 600; }
    .log-row time { color: #8aaeb0; font-variant-numeric: tabular-nums; }
    #mute-btn { pointer-events: auto; position: absolute; bottom: 18px; right: 16px; display: grid; height: 42px; width: 42px; place-items: center; border: 1px solid rgba(84,245,228,.65); border-radius: 999px; background: rgba(4,18,23,.8); color: var(--cyan); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #mute-btn[aria-pressed="true"] { border-color: #8aaeb0; color: #8aaeb0; }
    @media (max-width: 560px) { #log-panel { top: 58px; right: 12px; width: min(210px, calc(100% - 24px)); max-height: 30vh; } #log-list { max-height: calc(30vh - 44px); } #mute-btn { right: 12px; bottom: 14px; } }
  </style>
</head>
<body>
  <main id="app">
    <section id="camera-container" aria-label="Live camera view">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div class="absolute left-4 top-4 z-10 flex items-center gap-2 text-xs uppercase tracking-[.18em] text-[#54f5e4]">
        <span class="h-2 w-2 animate-pulse rounded-full bg-[#54f5e4]"></span><span>Optical scan</span>
      </div>
      <div id="hud-shell">
        <aside id="log-panel" aria-live="polite">
          <div class="flex items-center justify-between px-3 py-2 text-[10px] uppercase tracking-[.16em] text-[#54f5e4]"><span>Intelligence log</span><span id="log-count">0</span></div>
          <div id="log-list"><div id="empty-log" class="px-3 py-3 text-[11px] text-[#8aaeb0]">Awaiting targets...</div></div>
        </aside>
        <button id="mute-btn" type="button" aria-label="Unmute audio" aria-pressed="true" title="Unmute audio">
          <svg id="speaker-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m19 9 2 2-2 2"/></svg>
        </button>
      </div>
    </section>
    <section id="ui-layer">
      <div id="error-banner"></div>
      <div class="mb-3 flex items-end justify-between">
        <div><p class="m-0 text-[10px] uppercase tracking-[.2em] text-[#8aaeb0]">Neural vision / COCO SSD</p><p id="status" class="m-0 mt-1 text-sm text-[#effffc]">Initializing...</p></div>
        <span id="object-count" class="text-xs tabular-nums text-[#ffb45c]">0 targets</span>
      </div>
      <button id="toggle-btn" class="w-full text-sm font-bold" disabled>Start scanning</button>
    </section>
  </main>

  <script>
    (function () {
      const video = document.getElementById('video');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const statusEl = document.getElementById('status');
      const countEl = document.getElementById('object-count');
      const toggleBtn = document.getElementById('toggle-btn');
      const errorBanner = document.getElementById('error-banner');
      let model = null;
      let stream = null;
      let isScanning = false;
      let isDetecting = false;
      let predictions = [];
      let trackedObjects = [];
      let detectionLog = [];
      let detectionRun = 0;
      let audioMuted = true;
      let audioContext = null;
      const minimumDetectionScore = 0.3;
      const ambiguousDetectionScore = 0.5;
      const ambiguousClasses = new Set(['handbag', 'vase', 'remote', 'cell phone', 'backpack', 'suitcase', 'bowl', 'bottle']);
      const smoothingFactor = 0.22;
      const missedFrameGrace = 3;
      const modelUrl = 'https://tfhub.dev/tensorflow/efficientdet/lite2/detection/1/model.json';
      const classLabels = ['', 'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat', 'traffic light', 'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee', 'skis', 'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket', 'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple', 'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch', 'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'cell phone', 'microwave', 'oven', 'toaster', 'sink', 'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'];
      const modelInputSize = 448;

      function playDetectionBlip() {
        if (audioMuted) return;
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(720, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(1040, audioContext.currentTime + 0.07);
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.045, audioContext.currentTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.1);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.11);
      }

      function addLogEntry(className) {
        const now = new Date();
        detectionLog.unshift({ className: className, time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
        detectionLog = detectionLog.slice(0, 30);
        document.getElementById('log-count').textContent = detectionLog.length;
        document.getElementById('empty-log').style.display = 'none';
        document.getElementById('log-list').innerHTML = detectionLog.map(function (entry) {
          return '<div class="log-row"><strong>' + entry.className + '</strong><time>' + entry.time + '</time></div>';
        }).join('');
      }

      function showError(message) {
        errorBanner.textContent = message;
        errorBanner.style.display = 'block';
        statusEl.textContent = 'System unavailable';
        statusEl.classList.add('status-error');
        toggleBtn.disabled = true;
      }

      function setStatus(message) {
        statusEl.textContent = message;
        statusEl.classList.remove('status-error');
      }

      function resizeCanvasToVideo() {
        const rect = video.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width * pixelRatio));
        canvas.height = Math.max(1, Math.round(rect.height * pixelRatio));
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function boxOverlap(firstBox, secondBox) {
        const firstRight = firstBox[0] + firstBox[2];
        const firstBottom = firstBox[1] + firstBox[3];
        const secondRight = secondBox[0] + secondBox[2];
        const secondBottom = secondBox[1] + secondBox[3];
        const intersectionWidth = Math.max(0, Math.min(firstRight, secondRight) - Math.max(firstBox[0], secondBox[0]));
        const intersectionHeight = Math.max(0, Math.min(firstBottom, secondBottom) - Math.max(firstBox[1], secondBox[1]));
        const intersection = intersectionWidth * intersectionHeight;
        const combinedArea = firstBox[2] * firstBox[3] + secondBox[2] * secondBox[3] - intersection;
        return combinedArea > 0 ? intersection / combinedArea : 0;
      }

      function outputTensor(outputs, names) {
        for (const name of names) if (outputs && outputs[name]) return outputs[name];
        return null;
      }

      function tensorList(outputs) {
        if (Array.isArray(outputs)) return outputs;
        if (outputs && typeof outputs === 'object' && !outputs.dataSync) return Object.values(outputs);
        return [outputs];
      }

      async function detectObjects() {
        const input = tf.tidy(function () {
          return tf.image.resizeBilinear(tf.browser.fromPixels(video), [modelInputSize, modelInputSize]).toInt().expandDims(0);
        });
        let outputs;
        try {
          outputs = await model.executeAsync(input);
          const tensors = tensorList(outputs).filter(Boolean);
          const boxesTensor = outputTensor(outputs, ['detection_boxes', 'boxes']) || tensors.find(function (tensor) { return tensor.shape && tensor.shape[tensor.shape.length - 1] === 4; });
          const scoresTensor = outputTensor(outputs, ['detection_scores', 'scores']);
          const classesTensor = outputTensor(outputs, ['detection_classes', 'classes']);
          const countTensor = outputTensor(outputs, ['num_detections', 'count']);
          const vectors = tensors.filter(function (tensor) { return tensor !== boxesTensor && tensor !== countTensor && tensor.size > 4; });
          const scores = scoresTensor || vectors.find(function (tensor) { return tensor.dataSync().every(function (value) { return value >= 0 && value <= 1; }); });
          const classes = classesTensor || vectors.find(function (tensor) { return tensor !== scores; });
          if (!boxesTensor || !scores || !classes) return [];
          const boxes = await boxesTensor.data();
          const scoreValues = await scores.data();
          const classValues = await classes.data();
          const countValues = countTensor ? await countTensor.data() : [scoreValues.length];
          const resultCount = Math.min(Math.round(countValues[0]), scoreValues.length, Math.floor(boxes.length / 4));
          const results = [];
          for (let index = 0; index < resultCount; index += 1) {
            const score = scoreValues[index];
            const className = classLabels[Math.round(classValues[index])] || 'unknown object';
            const threshold = ambiguousClasses.has(className) ? ambiguousDetectionScore : minimumDetectionScore;
            if (score < threshold) continue;
            const [top, left, bottom, right] = [boxes[index * 4], boxes[index * 4 + 1], boxes[index * 4 + 2], boxes[index * 4 + 3]];
            results.push({ class: className, score: score, bbox: [left * video.videoWidth, top * video.videoHeight, (right - left) * video.videoWidth, (bottom - top) * video.videoHeight] });
          }
          return results;
        } finally {
          input.dispose();
          tensorList(outputs).filter(Boolean).forEach(function (tensor) { if (typeof tensor.dispose === 'function') tensor.dispose(); });
        }
      }

      function updateTracks(predictions) {
        const matchedTrackIndexes = new Set();
        const matchedPredictionIndexes = new Set();

        predictions.forEach(function (prediction, predictionIndex) {
          const detectedClass = prediction.class || 'unknown object';
          let bestTrackIndex = -1;
          let bestOverlap = 0.05;
          trackedObjects.forEach(function (track, trackIndex) {
            if (matchedTrackIndexes.has(trackIndex) || track.class !== detectedClass) return;
            const overlap = boxOverlap(track.targetBox, prediction.bbox);
            if (overlap > bestOverlap) {
              bestOverlap = overlap;
              bestTrackIndex = trackIndex;
            }
          });

          if (bestTrackIndex >= 0) {
            const track = trackedObjects[bestTrackIndex];
            track.targetBox = prediction.bbox.slice();
            track.score = prediction.score;
            track.missedFrames = 0;
            matchedTrackIndexes.add(bestTrackIndex);
            matchedPredictionIndexes.add(predictionIndex);
          }
        });

        trackedObjects.forEach(function (track, trackIndex) {
          if (!matchedTrackIndexes.has(trackIndex)) track.missedFrames += 1;
        });

        predictions.forEach(function (prediction, predictionIndex) {
          if (matchedPredictionIndexes.has(predictionIndex)) return;
          trackedObjects.push({
            class: prediction.class || 'unknown object',
            bbox: prediction.bbox.slice(),
            targetBox: prediction.bbox.slice(),
            score: prediction.score,
            missedFrames: 0
          });
          addLogEntry(prediction.class || 'unknown object');
          playDetectionBlip();
        });
        trackedObjects = trackedObjects.filter(function (track) { return track.missedFrames <= missedFrameGrace; });
      }

      function interpolateBox(currentBox, targetBox) {
        return currentBox.map(function (value, index) {
          return value + (targetBox[index] - value) * smoothingFactor;
        });
      }

      function drawBoxes() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        ctx.clearRect(0, 0, width, height);
        countEl.textContent = trackedObjects.length + (trackedObjects.length === 1 ? ' target' : ' targets');
        if (!isScanning || !video.videoWidth || !trackedObjects.length) return;

        const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
        const offsetX = (width - video.videoWidth * scale) / 2;
        const offsetY = (height - video.videoHeight * scale) / 2;
        ctx.lineWidth = 2;
        ctx.font = 'bold 13px "Trebuchet MS", sans-serif';
        ctx.textBaseline = 'top';

        trackedObjects.forEach(function (track) {
          track.bbox = interpolateBox(track.bbox, track.targetBox);
          const [x, y, boxWidth, boxHeight] = track.bbox;
          const screenX = x * scale + offsetX;
          const screenY = y * scale + offsetY;
          const screenWidth = boxWidth * scale;
          const screenHeight = boxHeight * scale;
          const label = track.class + ' ' + (track.score * 100).toFixed(0) + '%';
          const labelWidth = ctx.measureText(label).width + 14;
          const labelY = Math.max(0, screenY - 23);

          ctx.strokeStyle = '#54f5e4';
          const corner = Math.min(18, screenWidth * 0.25, screenHeight * 0.25);
          ctx.beginPath();
          ctx.moveTo(screenX + corner, screenY); ctx.lineTo(screenX, screenY); ctx.lineTo(screenX, screenY + corner);
          ctx.moveTo(screenX + screenWidth - corner, screenY); ctx.lineTo(screenX + screenWidth, screenY); ctx.lineTo(screenX + screenWidth, screenY + corner);
          ctx.moveTo(screenX, screenY + screenHeight - corner); ctx.lineTo(screenX, screenY + screenHeight); ctx.lineTo(screenX + corner, screenY + screenHeight);
          ctx.moveTo(screenX + screenWidth - corner, screenY + screenHeight); ctx.lineTo(screenX + screenWidth, screenY + screenHeight); ctx.lineTo(screenX + screenWidth, screenY + screenHeight - corner);
          ctx.stroke();
          ctx.fillStyle = 'rgba(4, 25, 30, .92)';
          ctx.beginPath();
          ctx.roundRect(screenX, labelY, labelWidth, 21, 10.5);
          ctx.fill();
          ctx.fillStyle = '#54f5e4';
          ctx.fillText(label, screenX + 7, labelY + 3);
        });
      }

      function renderLoop() {
        drawBoxes();
        requestAnimationFrame(renderLoop);
      }

      async function detectionLoop(runId) {
        if (isDetecting) return;
        while (isScanning && runId === detectionRun && model) {
          if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
            await new Promise(function (resolve) { setTimeout(resolve, 16); });
            continue;
          }
          isDetecting = true;
          try {
            const nextPredictions = await detectObjects();
            if (isScanning && runId === detectionRun) {
              predictions = Array.isArray(nextPredictions) ? nextPredictions : [];
              updateTracks(predictions);
            }
          } catch (error) {
            if (runId === detectionRun) {
              predictions = [];
              updateTracks(predictions);
            }
          } finally {
            isDetecting = false;
          }
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
        }
        isDetecting = false;
      }

      async function startCamera() {
        setStatus('Requesting camera...');
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
          video.srcObject = stream;
          await video.play();
          resizeCanvasToVideo();
          window.addEventListener('resize', resizeCanvasToVideo);
          setStatus('Camera active');
          toggleBtn.disabled = false;
        } catch (error) {
          console.error(error);
          showError('Camera permission denied or unavailable. Use HTTPS and allow camera access.');
        }
      }

      async function loadModel() {
        setStatus('Initializing Neural Engine...');
        try {
          let backend = 'webgl';
          try {
            setStatus('Preparing WebGL accelerator...');
            if (!await tf.setBackend('webgl')) throw new Error('WebGL backend was not registered');
            await tf.ready();
          } catch (webglError) {
            console.warn('WebGL backend unavailable, using CPU fallback.', webglError);
            backend = 'cpu';
            setStatus('WebGL unavailable. Switching to CPU...');
            if (!await tf.setBackend('cpu')) throw new Error('CPU backend was not registered');
            await tf.ready();
          }
          setStatus('Downloading AI Weights (' + backend.toUpperCase() + ')...');
          toggleBtn.disabled = true;
          model = await tf.loadGraphModel(modelUrl, { fromTFHub: true });
          setStatus('Neural Engine Ready (' + backend.toUpperCase() + ')');
        } catch (error) {
          console.error(error);
          model = null;
          showError('Model Load Failed: Check Connection');
        }
      }

      toggleBtn.addEventListener('click', async function () {
        if (!model) return;
        if (!stream) { await startCamera(); if (!stream) return; }
        isScanning = !isScanning;
        detectionRun += 1;
        if (isScanning) {
          toggleBtn.textContent = 'Stop scanning';
          toggleBtn.style.background = '#ffb45c';
          toggleBtn.style.color = '#061217';
          statusEl.textContent = 'Scanning active';
          detectionLoop(detectionRun);
        } else {
          toggleBtn.textContent = 'Start scanning';
          toggleBtn.style.background = '#54f5e4';
          toggleBtn.style.color = '#061217';
          statusEl.textContent = 'Scanning paused';
          predictions = [];
          trackedObjects = [];
        }
      });

      document.getElementById('mute-btn').addEventListener('click', function () {
        audioMuted = !audioMuted;
        this.setAttribute('aria-pressed', String(audioMuted));
        this.setAttribute('aria-label', audioMuted ? 'Unmute audio' : 'Mute audio');
        this.title = audioMuted ? 'Unmute audio' : 'Mute audio';
        this.innerHTML = audioMuted
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m19 9 2 2-2 2"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M19 5.5a9 9 0 0 1 0 13"/></svg>';
        if (!audioMuted) {
          if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
        }
      });

      renderLoop();
      (async function init() { await loadModel(); await startCamera(); })();
    })();
  </script>
</body>
</html>
